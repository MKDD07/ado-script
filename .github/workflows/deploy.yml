name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Groq Configuration
        env:
          GROQ_SECRET: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_SECRET" ]; then
            echo "::warning ::GROQ_API_KEY secret is not set or empty in repository secrets!"
          else
            echo "GROQ_API_KEY secret successfully detected."
          fi
          cat << EOF > config.js
          window.env = {
            GROQ_API_KEY: "$GROQ_SECRET",
            GROQ_CHAT_MODEL: "openai/gpt-oss-120b",
            GROQ_API_BASE: "https://api.groq.com/openai/v1"
          };
          EOF
          ls -la config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
